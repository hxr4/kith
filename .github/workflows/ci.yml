name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: vet
        run: go vet ./...
      - name: vet (all release targets)
        if: runner.os == 'macOS'
        run: |
          for t in darwin/arm64 darwin/amd64 windows/amd64 linux/amd64 linux/arm64 linux/arm; do
            GOOS=${t%/*} GOARCH=${t#*/} go vet ./...
          done
      - name: test (race, macOS/Linux)
        if: runner.os != 'Windows'
        run: go test -race -count=1 -timeout 20m ./...
      - name: test (Windows)
        if: runner.os == 'Windows'
        run: go test -count=1 -timeout 20m ./...

  gui:
    # The desktop app (Wails v3): frontend typecheck/build + Go vet/tests.
    # Full installers are built by release.yml.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: gui/go.mod, cache-dependency-path: gui/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: gui/frontend/package-lock.json }
      - name: frontend
        working-directory: gui/frontend
        run: npm ci && npm audit --omit=dev && npx tsc --noEmit && npm run build
      - name: go vet + test (macOS, Windows target)
        working-directory: gui
        run: |
          go vet .
          GOOS=windows GOARCH=amd64 go vet .
          go test -count=1 .

  mac:
    # Kith for macOS (SwiftUI, macOS 26+): unit tests and an arm64 app bundle.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Xcode
        run: |
          x=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$x" ] && sudo xcode-select -s "$x"
          xcodebuild -version
      - name: test
        working-directory: mac
        run: swift test
      - name: bundle
        run: ARCHS=arm64 sh mac/scripts/bundle.sh 0.0.0-ci

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build all targets with CGO disabled
        env:
          CGO_ENABLED: "0"
        run: |
          set -e
          for t in darwin/arm64 darwin/amd64 windows/amd64 linux/amd64 linux/arm64 linux/arm; do
            GOOS=${t%/*} GOARCH=${t#*/} go build -trimpath -o dist/kith-${t%/*}-${t#*/}$( [ ${t%/*} = windows ] && echo .exe ) ./cmd/kith
          done
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: kith-binaries
          path: dist/
